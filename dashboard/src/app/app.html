<div class="toast-container position-fixed bottom-0 end-0 p-3">
  @for (toast of toasts; track $index) {
    <div class="toast show mb-2" role="alert">
      <div class="toast-header text-bg-warning">
        <strong class="me-auto">Alarma</strong>
        <small>{{ toast.ts | date:'HH:mm:ss' }}</small>
        <button type="button" class="btn-close ms-2" (click)="cerrarToast(toast)"></button>
      </div>
      <div class="toast-body">{{ toast.mensaje }}</div>
    </div>
  }
</div>
